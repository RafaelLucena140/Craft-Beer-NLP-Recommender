services:
  chromadb:
    image: chromadb/chroma:1.0.0
    container_name: vector_database
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The local catalog and vector index survive container restarts.
      - ./data/chromadb_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=False
    restart: always
